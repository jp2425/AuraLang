[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/aura_lang"]

[project]
name = "AuraLang"
version = "0.1.0"
authors = [
    { name="José Gonçalves", email="jose.sousa.goncalves@celfocus.com" },
]
description = "Library for AuraLang"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "lark==1.3.1"
]

[project.urls]
"Homepage" = "https://github.com/jp2425/AuraLang"

[project.scripts]
aura = "aura_lang.main:main"

[tool.hatch.build.targets.wheel.force-include]
"grammar" = "grammar/"
